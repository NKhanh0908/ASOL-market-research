[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "casual-scout"
version = "0.1.0"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "jinja2>=3.1,<4",
    "httpx>=0.27,<1",
    "psutil>=6.0,<7",
    "itsdangerous>=2.2,<3",
    "python-multipart>=0.0.9,<1",
    "pydantic>=2,<3",
    "tzdata>=2024.1",
]

[project.scripts]
casual_scout = "casual_scout.cli:main"

[project.optional-dependencies]
android = ["selenium==4.49.0"]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
casual_scout = ["storage/schema.sql", "ai/schema.sql", "android/schema.sql", "web/templates/*.html", "web/static/*"]
